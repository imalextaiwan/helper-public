[pytest]
pythonpath = .
testpaths = tests
# 預設的 fd 層級輸出擷取會讓 Windows 上的 tk.Tk() 偶爾初始化失敗（讀不到 tk8.6\ttk\*.tcl），
# 改為只擷取 sys.stdout／sys.stderr
addopts = --capture=sys
# 物件被回收時、或背景執行緒裡發生的例外，算測試失敗，不只是警告
# （例如 Tk 的變數被背景執行緒回收：Tk 只接受主執行緒的呼叫）
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    error::pytest.PytestUnhandledThreadExceptionWarning
